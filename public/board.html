<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Move Board</title>
<link rel="icon" href="/favicon.ico" sizes="48x48">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="theme-color" content="#F1F4F2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0F1412" media="(prefers-color-scheme: dark)">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Wall display: totals, a strip of room tiles (% full), then five kanban columns of single-row cards.
   Cards can be dragged to another column (long-press first on touch), or tapped for a Move to menu. */
:root {
  --bg: #F1F4F2; --surface: #FFFFFF; --ink: #17201C; --muted: #586560; --line: #D7DED9;
  --accent: #0D6A56; --accent-soft: #DEEEE8; --on-accent: #FFFFFF;
  --tape: #A86F00; --tape-soft: #FBEFD3;
  --s-packed: #A86F00; --s-loaded: #6FB3A2; --s-inroom: #0D6A56; --s-unpacked: #17201C;
  --f-body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --f-mono: "JetBrains Mono", ui-monospace, Menlo, Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #0F1412; --surface: #161D1A; --ink: #E3E9E5; --muted: #9AA8A1; --line: #29332F;
    --accent: #4CC1A2; --accent-soft: #15302A; --on-accent: #0F1412;
    --tape: #EDB441; --tape-soft: #33290F;
    --s-packed: #EDB441; --s-loaded: #3E8F7C; --s-inroom: #4CC1A2; --s-unpacked: #E3E9E5; color-scheme: dark; }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.4 var(--f-body); -webkit-font-smoothing: antialiased; display: flex; flex-direction: column; padding: max(12px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(10px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); gap: 10px; }
h1, h2, h3 { margin: 0; }
button { font: inherit; color: inherit; cursor: pointer; }

.top { display: flex; align-items: center; gap: 18px; flex-wrap: wrap; }
.title { display: flex; flex-direction: column; line-height: 1.15; margin-right: auto; }
.title h1 { font-size: 22px; letter-spacing: -.01em; }
.title span { font-size: 13px; color: var(--muted); }
.title a { color: var(--accent); }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.1; }
.stat b { font-family: var(--f-mono); font-size: 26px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; overflow: hidden; background: var(--surface); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 13px; font-weight: 600; color: var(--muted); }
.seg button + button { border-left: 1px solid var(--line); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.join { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); max-width: 150px; line-height: 1.25; }
.join .qr { background: #FFFFFF; border-radius: 6px; padding: 4px; line-height: 0; flex: none; }
.join svg { width: 60px; height: 60px; display: block; }

.bar { display: flex; height: 8px; border-radius: 99px; overflow: hidden; background: var(--line); }
.bar i { display: block; height: 100%; }
.b-labelled { background: var(--muted); } .b-packed { background: var(--s-packed); } .b-loaded { background: var(--s-loaded); } .b-inroom { background: var(--s-inroom); } .b-unpacked { background: var(--s-unpacked); }

.rooms { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.room { background: var(--surface); border: 1px solid var(--line); border-top: 5px solid var(--sw, var(--line)); border-radius: 10px; padding: 7px 10px 8px; display: grid; grid-template-columns: 1fr auto; gap: 0 8px; align-items: baseline; }
.room h3 { font-size: 13.5px; font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.room .pct { font-family: var(--f-mono); font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; grid-row: span 2; align-self: center; }
.room .of { font-size: 12px; color: var(--muted); }
.room .mini { grid-column: 1 / -1; margin-top: 6px; height: 5px; }
.room.is-full .pct { color: var(--accent); }

.board { flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1100px) { .board { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 760px) { .board { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 560px) { .board { grid-template-columns: 1fr; } }
.col { position: relative; display: flex; flex-direction: column; min-height: 220px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.col-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--line); }
.col-head h2 { font-size: 14px; letter-spacing: .06em; text-transform: uppercase; }
.col-head b { margin-left: auto; font-family: var(--f-mono); font-size: 22px; font-variant-numeric: tabular-nums; }
.col-head .dot { width: 12px; height: 12px; border-radius: 4px; flex: none; }
.col-body { position: relative; flex: 1; min-height: 0; overflow-y: auto; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
/* When a column has more cards than fit, fade the bottom edge and say how many are below. */
.more { position: absolute; left: 1px; right: 1px; bottom: 0; padding: 34px 10px 10px; display: flex; justify-content: center; background: linear-gradient(color-mix(in srgb, var(--surface) 0%, transparent), var(--surface) 72%); pointer-events: none; border-radius: 0 0 14px 14px; }
.more[hidden] { display: none; }
.more button { pointer-events: auto; border: 0; border-radius: 99px; background: var(--ink); color: var(--bg); font-weight: 700; font-size: 13px; padding: 7px 15px; box-shadow: 0 2px 10px rgba(0,0,0,.2); }
.empty { color: var(--muted); text-align: center; padding: 24px 8px; font-size: 14px; }
.grp { font-size: 11.5px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); font-weight: 700; padding: 8px 6px 2px; display: flex; align-items: center; gap: 6px; }
.grp i { width: 9px; height: 9px; border-radius: 3px; background: var(--sw, var(--line)); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--ink) 25%, transparent); }

.card { display: grid; grid-template-columns: 3.4em 1fr; gap: 0 8px; align-items: baseline; padding: 6px 8px 6px 10px; border-radius: 8px; background: var(--bg); border-left: 5px solid var(--sw, var(--line)); }
.card .n { font-family: var(--f-mono); font-weight: 700; font-size: 18px; font-variant-numeric: tabular-nums; grid-row: span 2; align-self: center; }
.card .what { font-size: 14px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card .what.is-empty { color: var(--muted); font-weight: 500; font-style: italic; }
.card .rm { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card.is-new { background: var(--accent-soft); box-shadow: inset 0 0 0 1px var(--accent); }
.card { cursor: grab; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
.card.is-lifted { opacity: .35; }
.card.ghost { position: fixed; left: 0; top: 0; z-index: 80; pointer-events: none; margin: 0; cursor: grabbing; box-shadow: 0 10px 30px rgba(0,0,0,.28); transform-origin: 0 0; }
body.is-dragging, body.is-dragging * { cursor: grabbing !important; }
.col.is-target { border-color: var(--accent); box-shadow: inset 0 0 0 2px var(--accent); }
.col.is-target .col-body { background: var(--accent-soft); }
.menu { position: fixed; left: 50%; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 90; width: min(380px, calc(100% - 32px)); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 12px 40px rgba(0,0,0,.25); padding: 14px; display: flex; flex-direction: column; gap: 8px; }
.menu b { font-size: 15px; }
.menu .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.menu .opts button { border: 1px solid var(--line); border-radius: 10px; background: var(--bg); padding: 10px; font-weight: 600; font-size: 14px; display: flex; align-items: center; gap: 8px; }
.menu .opts button i { width: 10px; height: 10px; border-radius: 3px; flex: none; }
.menu .opts button:disabled { opacity: .5; cursor: default; }
.menu .x { border: 0; background: none; color: var(--muted); font-weight: 600; padding: 6px; }
.say { position: fixed; left: 50%; top: calc(14px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 95; max-width: calc(100% - 32px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; font-weight: 600; box-shadow: 0 6px 20px rgba(0,0,0,.2); }
.say.bad { background: #B3261E; color: #FFFFFF; }

.foot { display: flex; justify-content: space-between; gap: 12px; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.foot .bad { color: #B3261E; font-weight: 600; }
</style>
</head>
<body>
<header class="top">
  <div class="title">
    <h1 id="title">Move board</h1>
    <span>133 Oratava → 12 Savoy Court · <a href="/">Scanner</a> · <a href="/plan">Plan</a></span>
  </div>
  <div class="seg" role="group" aria-label="Sort cards"><button type="button" data-sort="num">By number</button><button type="button" data-sort="room">By room</button></div>
  <div class="stat"><b id="sTotal">–</b><span>Boxes</span></div>
  <div class="stat"><b id="sTodo">–</b><span>Not packed yet</span></div>
  <div class="stat"><b id="sPct">–</b><span>At Savoy</span></div>
  <div class="join"><div class="qr" id="qr" aria-hidden="true"></div><span>Helping? Scan to open the scanner</span></div>
</header>

<div class="bar" id="bar" role="img" aria-label="Overall progress"><i class="b-packed"></i><i class="b-loaded"></i><i class="b-inroom"></i><i class="b-unpacked"></i></div>

<section class="rooms" id="rooms" aria-label="How full each room is"></section>

<main class="board" id="board"></main>

<footer class="foot"><span id="updated">Connecting…</span><span>Drag a card to another column (on a touch screen, hold it first), or tap it to move it.</span><span id="wake"></span></footer>
<div class="menu" id="menu" role="dialog" aria-labelledby="menuT" hidden><b id="menuT"></b><div class="opts" id="menuOpts"></div><button class="x" type="button" id="menuX">Cancel</button></div>
<div class="say" id="say" role="status" hidden></div>

<script src="/vendor/qrcode-generator-1.4.4.js"></script>
<script>
(function () {
  "use strict";
  const STEPS = ["labelled", "packed", "loaded", "inroom", "unpacked"];
  const COLS = [["labelled", "To pack"], ["packed", "Packed"], ["loaded", "Loaded"], ["inroom", "In room"], ["unpacked", "Unpacked"]];
  const COL_NAME = Object.fromEntries(COLS);
  const BAR = ["packed", "loaded", "inroom", "unpacked"]; // the progress bar leaves out boxes not packed yet
  const EMPTY = { labelled: "Everything's packed", packed: "Nothing packed and waiting", loaded: "Nothing on a truck", inroom: "Nothing in its room yet", unpacked: "Nothing unpacked yet" };
  const FRESH_MS = 90 * 1000;
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const num = (v) => { const n = Number(v); return Number.isFinite(n) && n > 0 ? Math.floor(n) : 0; };
  const pad3 = (n) => String(num(n)).padStart(3, "0");
  const statusOf = (b) => (STEPS.includes(b.status) ? b.status : b.arrived === true ? "inroom" : "labelled");
  const hexOf = (c) => (c && /^#[0-9a-fA-F]{6}$/.test(c.hex || "") ? c.hex : "");
  const when = (iso) => { const t = Date.parse(iso || ""); return Number.isFinite(t) ? t : 0; };
  const arrived = (st) => st === "inroom" || st === "unpacked";
  // /board?test shows test labels (T001...) too, for trying out the scanner.
  const SHOW_TESTS = new URLSearchParams(location.search).has("test");
  if (SHOW_TESTS) $("#title").textContent = "Move board (with test labels)";
  const tagOf = (b) => (b.test ? "T" : "") + pad3(b.n);
  const photoCount = (b) => (Array.isArray(b.photos) ? b.photos.length : 0);

  let sort = "num";
  try { sort = localStorage.getItem("boardSort") === "room" ? "room" : "num"; } catch (e) {}

  // Columns are built once; refreshes only replace their contents when something changed.
  $("#board").innerHTML = COLS.map(([k, l]) => `<section class="col" data-k="${k}" aria-labelledby="h-${k}"><div class="col-head"><i class="dot b-${k}"></i><h2 id="h-${k}">${l}</h2><b id="n-${k}">0</b></div><div class="col-body" id="c-${k}"></div><div class="more" id="m-${k}" hidden><button type="button" data-more="${k}"></button></div></section>`).join("");

  // How many cards in a column sit below what's on screen. Shown as "3 more below" over a faded edge.
  function updateMore(k) {
    const body = $("#c-" + k), box = $("#m-" + k);
    const bottom = body.scrollTop + body.clientHeight;
    const n = [...body.querySelectorAll(".card")].filter((c) => c.offsetTop + c.offsetHeight > bottom + 2).length;
    box.hidden = n === 0;
    if (n) box.firstElementChild.textContent = `↓ ${n} more below`;
  }
  const updateAllMore = () => COLS.forEach(([k]) => updateMore(k));
  COLS.forEach(([k]) => $("#c-" + k).addEventListener("scroll", () => updateMore(k), { passive: true }));
  window.addEventListener("resize", updateAllMore);
  $("#board").addEventListener("click", (e) => {
    const b = e.target.closest("[data-more]"); if (!b) return;
    const body = $("#c-" + b.dataset.more); body.scrollBy({ top: body.clientHeight * 0.8, behavior: "smooth" });
  });

  try {
    const q = window.qrcode(0, "M"); q.addData(location.origin + "/"); q.make();
    $("#qr").innerHTML = q.createSvgTag({ cellSize: 3, margin: 2 });
  } catch (e) { $(".join").hidden = true; }

  let rooms = {}, boxes = {}, okAt = 0, lastSig = "";
  const roomList = () => Object.entries(rooms).map(([id, r]) => Object.assign({ id }, r)).filter((r) => r.list === "unpack" && r.kind !== "prep").sort((a, b) => (a.order || 0) - (b.order || 0));

  function card(b, fresh) {
    const r = rooms[b.dest];
    return `<div class="card ${fresh ? "is-new" : ""}" data-id="${esc(b.id)}" style="--sw:${r ? hexOf(r.colour) || "var(--line)" : "var(--line)"}">
      <span class="n">${tagOf(b)}</span>
      ${b.cat ? `<span class="what">${esc(b.cat)}</span>` : photoCount(b) ? `<span class="what">${photoCount(b) === 1 ? "1 photo" : photoCount(b) + " photos"}</span>` : `<span class="what is-empty">Contents not set</span>`}
      <span class="rm">→ ${esc(r ? r.name : "No room yet")}</span></div>`;
  }

  function render(force) {
    const now = Date.now();
    const all = Object.entries(boxes).map(([id, b]) => Object.assign({ id }, b)).filter((b) => SHOW_TESTS || !b.test);
    const fresh = new Set(all.filter((b) => b.statusAt && now - when(b.statusAt) < FRESH_MS).map((b) => b.id));
    // Skip the redraw when nothing visible has changed, so the screen doesn't flicker.
    const sig = JSON.stringify([sort, all.map((b) => [b.id, statusOf(b), b.cat || "", b.dest || "", photoCount(b)]).sort(), [...fresh].sort(), roomList().map((r) => [r.id, r.name, hexOf(r.colour)])]);
    if (!force && sig === lastSig) return;
    lastSig = sig;

    const by = { labelled: [], packed: [], loaded: [], inroom: [], unpacked: [] };
    all.forEach((b) => by[statusOf(b)].push(b));
    const total = all.length, there = by.inroom.length + by.unpacked.length;
    $("#sTotal").textContent = total;
    $("#sTodo").textContent = by.labelled.length;
    $("#sPct").textContent = total ? Math.round((there / total) * 100) + "%" : "–";
    const bars = $("#bar").children;
    BAR.forEach((k, i) => { bars[i].style.width = total ? (by[k].length / total) * 100 + "%" : "0"; });

    // Room tiles: how much of each room's stuff has arrived (in room or unpacked).
    const tiles = roomList().map((r) => ({ r, rows: all.filter((b) => b.dest === r.id) })).filter((t) => t.rows.length);
    const loose = all.filter((b) => !b.dest || !rooms[b.dest]);
    if (loose.length) tiles.push({ r: null, rows: loose });
    $("#rooms").innerHTML = tiles.map(({ r, rows }) => {
      const a = rows.filter((b) => arrived(statusOf(b))).length, pct = Math.round((a / rows.length) * 100);
      const seg = (k) => (rows.filter((b) => statusOf(b) === k).length / rows.length) * 100;
      return `<div class="room ${a === rows.length ? "is-full" : ""}" style="--sw:${r ? hexOf(r.colour) || "var(--line)" : "var(--line)"}">
        <h3>${esc(r ? r.name : "No room yet")}</h3><span class="pct">${pct}%</span>
        <span class="of">${a} of ${rows.length} in</span>
        <div class="bar mini"><i class="b-packed" style="width:${seg("packed")}%"></i><i class="b-loaded" style="width:${seg("loaded")}%"></i><i class="b-inroom" style="width:${seg("inroom")}%"></i><i class="b-unpacked" style="width:${seg("unpacked")}%"></i></div></div>`;
    }).join("");

    const order = new Map(roomList().map((r, i) => [r.id, i]));
    const byNum = (a, b) => (a.test ? 1 : 0) - (b.test ? 1 : 0) || num(a.n) - num(b.n);
    COLS.forEach(([k]) => {
      const rows = by[k];
      $("#n-" + k).textContent = rows.length;
      let html;
      if (!rows.length) html = `<div class="empty">${EMPTY[k]}</div>`;
      else if (sort === "num") html = rows.sort(byNum).map((b) => card(b, fresh.has(b.id))).join("");
      else {
        const rank = (b) => (order.has(b.dest) ? order.get(b.dest) : 999);
        rows.sort((a, b) => rank(a) - rank(b) || byNum(a, b));
        html = ""; let cur = null;
        rows.forEach((b) => {
          if (b.dest !== cur) { cur = b.dest; const r = rooms[b.dest]; html += `<div class="grp" style="--sw:${r ? hexOf(r.colour) || "var(--line)" : "var(--line)"}"><i></i>${esc(r ? r.name : "No room yet")}</div>`; }
          html += card(b, fresh.has(b.id));
        });
      }
      const body = $("#c-" + k);
      if (body.innerHTML !== html) { const top = body.scrollTop; body.innerHTML = html; body.scrollTop = top; }
    });
    requestAnimationFrame(updateAllMore);
  }

  function paintSort() { document.querySelectorAll("[data-sort]").forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.sort === sort))); }
  paintSort();
  document.querySelector(".seg").addEventListener("click", (e) => {
    const b = e.target.closest("[data-sort]"); if (!b) return;
    sort = b.dataset.sort; try { localStorage.setItem("boardSort", sort); } catch (err) {}
    paintSort(); render(true);
  });

  // ---------- Moving cards between columns ----------
  // Mouse: drag. Touch: hold a card for a moment, then drag (a quick swipe still scrolls). Any card can
  // also be tapped for a Move to menu. The server still refuses loading before it opens.
  const pending = new Map();
  let drag = null, droppedAt = 0, sayT;
  function say(msg, bad) { const el = $("#say"); el.textContent = msg; el.classList.toggle("bad", !!bad); el.hidden = false; clearTimeout(sayT); sayT = setTimeout(() => (el.hidden = true), bad ? 6000 : 2500); }
  async function moveBox(id, from, to) {
    const b = boxes[id]; if (!b || from === to) return;
    const before = b;
    pending.set(id, to); boxes[id] = Object.assign({}, b, { status: to, statusAt: new Date().toISOString() }); render(true);
    try {
      const r = await fetch("/api/boxes/" + encodeURIComponent(id), { method: "PATCH", headers: { "content-type": "application/json" }, body: JSON.stringify({ status: to, from, resetScan: true }) });
      const body = await r.json().catch(() => ({}));
      if (!r.ok) { const err = new Error(body.error || "Couldn't move it (HTTP " + r.status + ")."); err.box = body.box; throw err; }
      boxes[id] = body.box; say(`${tagOf(body.box)} → ${COL_NAME[to]}`);
    } catch (e) { boxes[id] = e.box || before; say(e.message || "Couldn't move it. Check the connection.", true); }
    pending.delete(id); render(true);
  }
  const colAt = (x, y) => { const el = document.elementFromPoint(x, y), col = el && el.closest(".col"); return col ? col.dataset.k : null; };
  function startDrag() {
    const r = drag.el.getBoundingClientRect(), g = drag.el.cloneNode(true);
    g.classList.add("ghost"); g.style.width = r.width + "px";
    drag.dx = drag.x - r.left; drag.dy = drag.y - r.top; drag.ghost = g; drag.active = true;
    document.body.appendChild(g); drag.el.classList.add("is-lifted"); document.body.classList.add("is-dragging");
    closeMenu(); moveDrag(drag.x, drag.y); requestAnimationFrame(autoScroll);
  }
  function moveDrag(x, y) {
    drag.x = x; drag.y = y;
    drag.ghost.style.transform = `translate(${x - drag.dx}px, ${y - drag.dy}px) rotate(-1.5deg)`;
    const k = colAt(x, y);
    document.querySelectorAll(".col").forEach((c) => c.classList.toggle("is-target", c.dataset.k === k && k !== drag.from));
  }
  // Near the top or bottom of a column (or of the screen, on a phone): scroll that way.
  function autoScroll() {
    if (!drag || !drag.active) return;
    const { x, y } = drag, el = document.elementFromPoint(x, y), body = el && el.closest(".col-body");
    if (body) { const r = body.getBoundingClientRect(); if (y < r.top + 36) body.scrollTop -= 10; else if (y > r.bottom - 36) body.scrollTop += 10; }
    if (y < 40) window.scrollBy(0, -12); else if (y > window.innerHeight - 40) window.scrollBy(0, 12);
    requestAnimationFrame(autoScroll);
  }
  function stopDrag(drop) {
    if (!drag) return;
    clearTimeout(drag.timer);
    if (drag.active) {
      const to = drop ? colAt(drag.x, drag.y) : null, { id, from } = drag;
      drag.ghost.remove(); drag.el.classList.remove("is-lifted"); document.body.classList.remove("is-dragging");
      document.querySelectorAll(".col.is-target").forEach((c) => c.classList.remove("is-target"));
      droppedAt = Date.now(); // the click that follows a drop isn't a tap
      drag = null;
      if (to && to !== from) moveBox(id, from, to);
      else render(true);
      return;
    }
    drag = null;
  }
  const grab = (c, x, y, touch) => ({ id: c.dataset.id, from: c.closest(".col").dataset.k, el: c, x0: x, y0: y, x, y, touch, active: false });
  const board = $("#board");
  board.addEventListener("pointerdown", (e) => {
    if (e.pointerType === "touch" || e.button !== 0) return;
    const c = e.target.closest(".card[data-id]"); if (c) drag = grab(c, e.clientX, e.clientY, false);
  });
  window.addEventListener("pointermove", (e) => {
    if (!drag || drag.touch || e.pointerType === "touch") return;
    if (!drag.active) { drag.x = e.clientX; drag.y = e.clientY; if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) > 6) startDrag(); return; }
    e.preventDefault(); moveDrag(e.clientX, e.clientY);
  });
  window.addEventListener("pointerup", (e) => { if (drag && !drag.touch && e.pointerType !== "touch") stopDrag(true); });
  board.addEventListener("touchstart", (e) => {
    const c = e.target.closest(".card[data-id]"); if (!c || e.touches.length !== 1) return;
    const t = e.touches[0]; drag = grab(c, t.clientX, t.clientY, true);
    drag.timer = setTimeout(() => { if (drag && !drag.active) { startDrag(); if (navigator.vibrate) navigator.vibrate(12); } }, 280);
  }, { passive: true });
  window.addEventListener("touchmove", (e) => {
    if (!drag || !drag.touch) return;
    const t = e.touches[0];
    if (!drag.active) { if (Math.hypot(t.clientX - drag.x0, t.clientY - drag.y0) > 10) stopDrag(false); else { drag.x = t.clientX; drag.y = t.clientY; } return; }
    e.preventDefault(); moveDrag(t.clientX, t.clientY);
  }, { passive: false });
  window.addEventListener("touchend", (e) => { if (!drag || !drag.touch) return; if (drag.active && e.cancelable) e.preventDefault(); stopDrag(true); });
  window.addEventListener("touchcancel", () => { if (drag && drag.touch) stopDrag(false); });
  board.addEventListener("contextmenu", (e) => { if (e.target.closest(".card")) e.preventDefault(); });
  document.addEventListener("keydown", (e) => { if (e.key === "Escape") { if (drag) stopDrag(false); closeMenu(); } });

  // Tap a card: Move to menu.
  let menuId = null;
  function openMenu(id) {
    const b = boxes[id]; if (!b) return;
    menuId = id; const here = statusOf(b);
    $("#menuT").textContent = `Move ${tagOf(b)}${b.cat ? " · " + b.cat : ""} to`;
    $("#menuOpts").innerHTML = COLS.map(([k, l]) => `<button type="button" data-to="${k}" ${k === here ? "disabled" : ""}><i class="b-${k}"></i>${l}${k === here ? " (now)" : ""}</button>`).join("");
    $("#menu").hidden = false;
  }
  function closeMenu() { $("#menu").hidden = true; menuId = null; }
  board.addEventListener("click", (e) => {
    const c = e.target.closest(".card[data-id]"); if (!c || Date.now() - droppedAt < 400) return;
    openMenu(c.dataset.id);
  });
  $("#menuOpts").addEventListener("click", (e) => {
    const b = e.target.closest("[data-to]"); if (!b || !menuId || !boxes[menuId]) return;
    const id = menuId; closeMenu(); moveBox(id, statusOf(boxes[id]), b.dataset.to);
  });
  $("#menuX").addEventListener("click", closeMenu);
  document.addEventListener("click", (e) => { if (!$("#menu").hidden && !e.target.closest("#menu") && !e.target.closest(".card")) closeMenu(); });

  async function refresh() {
    try {
      const r = await fetch("/api/state", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const s = await r.json();
      rooms = s.rooms || {}; boxes = s.boxes || {}; okAt = Date.now();
      // A move still on its way to the server stays where it was dropped.
      pending.forEach((st, id) => { if (boxes[id]) boxes[id] = Object.assign({}, boxes[id], { status: st }); });
    } catch (e) { /* keep the last board on screen; the footer says it's stale */ }
    if (okAt && !(drag && drag.active)) render(false);
    const stale = okAt && Date.now() - okAt > 20000;
    const text = !okAt ? `<span class="bad">Can't reach the box list yet</span>` : stale ? `<span class="bad">Lost connection · last updated ${new Date(okAt).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit" })}</span>` : `Live · updated ${new Date(okAt).toLocaleTimeString("en-AU", { hour: "numeric", minute: "2-digit", second: "2-digit" })}`;
    if ($("#updated").innerHTML !== text) $("#updated").innerHTML = text;
  }
  refresh();
  setInterval(refresh, 3000);

  // Keep the tablet's screen on while the board is showing.
  let lock = null;
  async function keepAwake() {
    if (!("wakeLock" in navigator)) { $("#wake").textContent = "Set the screen to never sleep to keep this on show"; return; }
    if (document.hidden) return;
    try { lock = await navigator.wakeLock.request("screen"); $("#wake").textContent = "Screen kept awake"; lock.addEventListener("release", () => { $("#wake").textContent = ""; }); }
    catch (e) { $("#wake").textContent = "Tap anywhere to keep the screen awake"; }
  }
  keepAwake();
  document.addEventListener("visibilitychange", () => { if (!document.hidden) { keepAwake(); refresh(); } });
  document.addEventListener("click", () => { if (!lock || lock.released) keepAwake(); });
})();
</script>
</body>
</html>
