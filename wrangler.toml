name = "move"
main = "src/index.js"
compatibility_date = "2026-09-01"

[assets]
directory = "public"
binding = "ASSETS"
# Page paths with no file behind them (like /b/014 from a QR code) get index.html.
not_found_handling = "single-page-application"
# The API always runs in the Worker, never the static-file fallback.
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "move"
database_id = "dfe4fa59-944a-435f-9dbc-47a78cbc1702"

[vars]
# The checklists (/api/lists/*) stay locked until one of these is set. See README step 3.
ACCESS_TEAM_DOMAIN = "rog42"        # Zero Trust team name (rog42.cloudflareaccess.com)
# ACCESS_AUD = ""                   # optional: the Access application's AUD tag
# LISTS_OPEN = "1"                  # opens the checklists to anyone with the link
# LOAD_FROM = "2026-11-06T17:00:00+11:00"   # boxes can't go past Packed before this (the default)

# Worker Previews (one per branch / pull request). They don't inherit the settings
# above, so they get their own test database and the same Access team name.
# move-preview holds the Savoy rooms and no boxes, so trying things out never
# touches the live box list. The checklists stay locked on previews.
[previews.vars]
ACCESS_TEAM_DOMAIN = "rog42"

[[previews.d1_databases]]
binding = "DB"
database_name = "move-preview"
database_id = "f3a80fe7-330d-42f9-85d1-f5240595e6d4"
